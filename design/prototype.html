const BLANK={arch:'discrete',gpus:1,vram:24,gbw:1000,link:'pcie',ram:64,rbw:90,tf:100,fp8:true,be:'cuda',disk:1000,dspd:5};
function specFromPicks(picks,host){
 const items=DEVICES.filter(d=>picks[d.id]>0).map(d=>({...d,qty:picks[d.id]}));
 if(!items.length)return null;
 const uni=items.filter(d=>d.t==='unified'),gpu=items.filter(d=>d.t==='gpu');const n=items.reduce((a,d)=>a+d.qty,0);
 const devId=items.length===1?items[0].id:null;
 if(!gpu.length){const big=[...uni].sort((x,y)=>y.mem-x.mem)[0];
  return {arch:'unified',gpus:n,vram:0,gbw:Math.min(...uni.map(d=>d.bw)),link:n>1?'network':'none',ram:uni.reduce((a,d)=>a+d.mem*d.qty,0),rbw:Math.min(...uni.map(d=>d.bw)),tf:uni.reduce((a,d)=>a+d.tf*d.qty,0),fp8:uni.every(d=>d.fp8),be:uni[0].be,disk:host.disk,dspd:host.dspd,devId,single:{mem:big.mem*0.85,bw:big.bw,tf:big.tf}}}
 const big=[...gpu].sort((x,y)=>y.mem-x.mem)[0],cnt=gpu.reduce((a,d)=>a+d.qty,0);
 return {arch:'discrete',gpus:cnt,vram:gpu.reduce((a,d)=>a+d.mem*d.qty,0)/cnt,gbw:Math.min(...gpu.map(d=>d.bw)),link:uni.length?'network':'pcie',ram:host.ram+uni.reduce((a,d)=>a+d.mem*d.qty,0),rbw:host.rbw,tf:gpu.reduce((a,d)=>a+d.tf*d.qty,0),fp8:gpu.every(d=>d.fp8),be:gpu[0].be,disk:host.disk,dspd:host.dspd,devId,single:{mem:big.mem*0.92,bw:big.bw,tf:big.tf}};
}
const fastMem=s=>!s?0:s.arch==='unified'?s.ram*0.85:s.arch==='cpu'?0:s.vram*s.gpus*0.92;
function runOn(m,v,s,ctxK){
 const kv=m.kv_kb*ctxK*1000/1048576,need=v.gb*1.05+kv+1.5,gmem=fastMem(s),cmem=s.arch!=='unified'?Math.max(0,s.ram*0.8-4):0;
 const res={need:Math.round(need),load:Math.round(v.gb/Math.max(0.1,s.dspd)),disk:v.gb<=s.disk};
 if(v.fmt!=='gguf'){if(s.arch==='cpu'||s.be==='cpu')return {...res,where:'no',why:'Needs a GPU runtime (vLLM / MLX)'};if(v.fmt==='fp8'&&!s.fp8)return {...res,where:'no',why:'Needs FP8 support'};if(v.fmt==='int4'&&s.be==='metal')return {...res,where:'no',why:'Format not supported on Mac'}}
 let where;if(s.arch!=='cpu'&&need<=gmem)where='gpu';else if(v.fmt==='gguf'&&need<=gmem+cmem)where=s.arch==='cpu'?'cpu':'offload';
 else return {...res,where:'no',why:v.fmt!=='gguf'&&need<=gmem+cmem?`Needs ${Math.round(need)} GB of GPU memory; this format can't spill into RAM`:`Needs ${Math.round(need)} GB, has ${Math.round(gmem+cmem)} GB`};
 const one=s.single||(s.arch==='unified'?{mem:gmem/s.gpus,bw:s.gbw,tf:s.tf/s.gpus}:{mem:s.vram*0.92,bw:s.gbw,tf:s.tf/s.gpus});
 const solo=where==='gpu'&&s.gpus>1&&need<=one.mem;
 const bpt=m.active_b*v.bits/8,frac=where==='gpu'?0:where==='cpu'?1:(need-gmem)/need;
 const eff=s.gpus>1&&!solo?(s.link==='nvlink'?0.55:s.link==='network'?0.35:0.45):0.6,gbw=solo?one.bw:s.gbw;
 const t=(bpt*(1-frac))/(Math.max(1,gbw)*eff)+(bpt*frac)/(Math.max(1,s.rbw)*0.6);
 // MoE routing and Metal kernels land further below the bandwidth ceiling
 const tps=Math.max(0.1,(1/t)*(m.active_b<m.total_b?0.7:1)*(s.be==='metal'?0.8:1));
 const rt=v.fmt==='gguf'?(s.be==='metal'&&where==='gpu'?'llama.cpp or MLX':'llama.cpp'):(s.be==='metal'?'MLX':'vLLM / SGLang');
 return {...res,where,solo,rt,tps:+tps.toFixed(1),lo:Math.max(0.1,+(tps*0.7).toFixed(1)),hi:+(tps*1.15).toFixed(1),prefill:Math.round((where==='cpu'?2:solo?one.tf:s.tf)*1e12*0.3/(2*m.active_b*1e9)),why:''};
}
const measured=(m,v,s)=>s&&s.devId?MEASURED.find(x=>x.dev===s.devId&&x.m===m.id&&x.q===v.q&&x.up===v.up):null;
// best variant: near-lossless (KLD ≤ 0.01) and smallest if one fits fast memory, else lowest-loss that runs
function bestRun(m,s,ctx){const fs=m.variants.filter(v=>v.kld!=null).map(v=>({v,...runOn(m,v,s,ctx)}));const rk={gpu:0,offload:1,cpu:1,no:2};
 const g=fs.filter(f=>f.where==='gpu'),nl=g.filter(f=>f.v.kld<=0.01).sort((a,b)=>a.v.gb-b.v.gb);
 const best=nl[0]||[...g].sort((a,b)=>a.v.kld-b.v.kld)[0]||[...fs].filter(f=>f.where!=='no').sort((a,b)=>rk[a.where]-rk[b.where]||a.v.kld-b.v.kld)[0]||[...fs].sort((a,b)=>a.v.gb-b.v.gb)[0];return {fs,best}}

const UPC={unsloth:['#F47321','circle'],bartowski:['#8EA8C3','square'],'lmstudio-community':['#B4D7CD','diamond'],mradermacher:['#FFEEB3','triangle'],'ggml-org':['var(--ink)','circle']};

function Scatter({pts,front,best,bud}){
 const ref=useRef(null);const [sz,setSz]=useState({w:600,h:340});
 useEffect(()=>{const el=ref.current;const ro=new ResizeObserver(()=>setSz({w:el.clientWidth,h:el.clientHeight}));ro.observe(el);return()=>ro.disconnect()},[]);
 const {w,h}=sz,narrow=w<520,L=narrow?44:56,R=16,T=18,B=42;
 const xs=pts.map(p=>p.gb),x0=Math.floor(Math.min(...xs)*0.9),x1=Math.ceil(Math.max(...xs)*1.05);
 const yk=pts.map(p=>p.kld),y0=Math.log10(Math.min(...yk)*0.7),y1=Math.log10(Math.max(...yk)*1.4);
 const X=v=>L+(w-L-R)*(v-x0)/(x1-x0||1),Y=v=>T+(h-T-B)*(Math.log10(v)-y0)/(y1-y0||1);
 const yt=[0.001,0.003,0.01,0.03,0.1,0.3].filter(v=>Math.log10(v)>=y0&&Math.log10(v)<=y1);
 const step=(x1-x0)>200?100:(x1-x0)>60?20:(x1-x0)>25?5:2;const xt=[];for(let v=Math.ceil(x0/step)*step;v<=x1;v+=step)xt.push(v);
 const bx=X(Math.min(Math.max(bud,x0),x1));
 return <div ref={ref} className="relative h-[340px] sm:h-[380px]"><svg width={w} height={h} role="img" aria-label="Quality loss versus file size for each quant, by uploader">
  <rect x={bx} y={T} width={Math.max(0,w-R-bx)} height={h-T-B} fill="var(--soft)"/>
  {yt.map(v=><g key={v}><line x1={L} x2={w-R} y1={Y(v)} y2={Y(v)} stroke="var(--line)"/><text x={L-8} y={Y(v)+4} textAnchor="end" fontSize="12" fill="var(--mute)">{v}</text></g>)}
  {xt.filter((_,i)=>!narrow||i%2===0).map(v=><text key={v} x={X(v)} y={h-B+18} textAnchor="middle" fontSize="12" fill="var(--mute)">{v} GB</text>)}
  <text x={L} y={h-6} fontSize="12" fill="var(--mute)">File size →</text><text x={L-6} y={T-6} fontSize="12" fill="var(--mute)" textAnchor="start" transform={`translate(${-L+14} 0)`}>Quality loss (KLD, log) — lower is better</text>
  <polyline points={front.map(p=>`${X(p.gb)},${Y(p.kld)}`).join(' ')} fill="none" stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="5 4"/>
  <line x1={bx} x2={bx} y1={T} y2={h-B} stroke="var(--acc)" strokeWidth="2"/><text x={Math.min(bx+6,w-R-70)} y={T+14} fontSize="12" fontWeight="700" fill="var(--ink)" style={{paintOrder:'stroke',stroke:'var(--card)',strokeWidth:4}}>{bud} GB budget</text>
  {pts.map((p,i)=><Mark key={i} x={X(p.gb)} y={Y(p.kld)} u={p.up} ring={best&&p===best}/>)}
  {best&&<text x={Math.min(X(best.gb)+14,w-R-150)} y={Math.max(Y(best.kld)-14,T+30)} fontSize="13" fontWeight="700" fill="var(--ink)" style={{paintOrder:'stroke',stroke:'var(--card)',strokeWidth:4}}>{best.up} {best.q}</text>}
 </svg></div>;

function Quants({qid,setQid,spec,open}){

 const pts=all.filter(v=>v.kld>0);const lo=Math.floor(Math.min(...pts.map(p=>p.gb))),hiG=Math.ceil(Math.max(...pts.map(p=>p.gb)));
 const fit=spec?Math.floor(fastMem(spec)-m.kv_kb*32000/1048576-1.5):null;
 const [bud,setBud]=useState(()=>Math.min(hiG,Math.max(lo,fit||Math.round((lo+hiG)/2))));
 useEffect(()=>{setBud(b=>Math.min(hiG,Math.max(lo,b)))},[m.id]);
 const front=[...pts].sort((a,b)=>a.gb-b.gb||a.kld-b.kld).reduce((acc,p)=>{if(!acc.length||p.kld<acc[acc.length-1].kld)acc.push(p);return acc},[]);
 const best=pts.filter(p=>p.gb<=bud).sort((a,b)=>a.kld-b.kld||a.gb-b.gb)[0];
 const ups=[...new Set(pts.map(p=>p.up))];
 // biggest gap between uploaders at the same size
 const groups={};pts.forEach(p=>{const k=Math.round(p.gb);(groups[k]=groups[k]||[]).push(p)});
 const gap=Object.values(groups).filter(g=>new Set(g.map(p=>p.up)).size>1).map(g=>{const s=[...g].sort((a,b)=>a.kld-b.kld);return {a:s[0],b:s[s.length-1],r:s[s.length-1].kld/s[0].kld}}).sort((x,y)=>y.r-x.r)[0];
 const others=MODELS.filter(x=>x.open&&!qm.includes(x));
 return <div className="space-y-5">
  <Card className="p-4 sm:p-6">
   <Head title={best?`Best under ${bud} GB: ${best.up} ${best.q}`:`No ${m.name} quant fits in ${bud} GB`}/>

    {fit!=null&&<button onClick={()=>setBud(Math.min(hiG,Math.max(lo,fit)))} className="h-9 px-4 rounded-full border border-line text-xs font-bold uppercase tracking-[.06em] hover:border-ink">Use my hardware ({fit} GB)</button>}</div>
   <div className="mt-4"><Scatter pts={pts} front={front} best={best} bud={bud}/></div>
   <div className="flex flex-wrap gap-x-5 gap-y-2 mt-3 text-xs font-semibold">{ups.map(u=><span key={u} className="flex items-center gap-1.5"><svg width="16" height="16" aria-hidden="true"><Mark x={8} y={8} u={u} r={5}/></svg>{u}</span>)}<span className="flex items-center gap-1.5 text-mute"><svg width="22" height="10" aria-hidden="true"><line x1="0" x2="22" y1="5" y2="5" stroke="var(--ink)" strokeDasharray="5 4" strokeWidth="1.5"/></svg>best trade-off line</span></div>
  </Card>
  <Card className="p-2 sm:p-3"><TableBox><thead className="bg-soft"><tr><Th>Uploader</Th><Th>Quant</Th><Th r>Bits</Th><Th r>Size</Th><Th r>KLD</Th><Th>Quality</Th>{spec&&<Th r>On your hardware</Th>}</tr></thead>
   <tbody>{[...all].sort((a,b)=>a.gb-b.gb).map(v=>{const r=spec&&runOn(m,v,spec,32),me=measured(m,v,spec),under=v.gb<=bud;return <tr key={v.repo+v.q} className={`border-t border-line ${under?'':'opacity-50'}`} style={{background:v===best?'color-mix(in srgb, var(--butter) 55%, transparent)':undefined}}>
    <td className="p-3"><span className="flex items-center gap-2"><svg width="14" height="14" aria-hidden="true"><Mark x={7} y={7} u={v.up} r={4.5}/></svg><span className="font-semibold">{v.up}</span></span></td><td className="p-3 num">{v.q}{front.includes(v)&&<span className="ml-1.5"><Tag>best trade-off</Tag></span>}</td>

    {spec&&<td className="p-3">{r.where==='no'?<span className="text-xs text-mute">Won't run</span>:<Speed r={r} meas={me}/>}</td>}</tr>})}</tbody></TableBox>
   <p className="text-xs text-mute p-3">KLD = how far a quant's token probabilities drift from the original BF16 model, measured on the same long, mixed test set for every uploader. {others.length?`Not enough quants to compare yet for ${others.map(x=>x.name).join(', ')}.`:''}</p></Card>
 </div>;

const SAMPLE=`{"host":"jignesh-spark","device":"spark","arch":"unified","devices":1,"memory_gb":128,"measured_bw_gbs":251,"fp16_tflops":118,"fp8":true,"backend":"cuda","disk_free_gb":2800,"disk_read_gbs":6.1}`;
function Probe({onProfile}){
 const [txt,setTxt]=useState(SAMPLE);const [err,setErr]=useState('');const [cp,setCp]=useState('');const [run,setRun]=useState(false);const [share,setShare]=useState(true);
 const cmd=share?'npx atlas-probe --bench --share':'npx atlas-probe --bench';
 const apply=()=>{try{const j=JSON.parse(txt);if(!j.memory_gb)throw 0;setRun(true);setTimeout(()=>onProfile({arch:j.arch||'discrete',gpus:j.devices||1,vram:j.vram_gb||0,gbw:j.measured_bw_gbs,link:'pcie',ram:j.memory_gb,rbw:j.ram_bw_gbs||j.measured_bw_gbs,tf:j.fp16_tflops,fp8:!!j.fp8,be:j.backend||'cuda',disk:j.disk_free_gb,dspd:j.disk_read_gbs,devId:j.device||null},`${j.host}, ${j.memory_gb} GB, ${j.measured_bw_gbs} GB/s measured`),700)}catch(e){setErr('That isn’t an Atlas profile. Paste the JSON the probe prints.')}};
 const Step=({n,title,children})=><Card className="p-5 sm:p-6"><div className="flex items-center gap-3"><span className="serif text-5xl leading-none text-acc">{n}</span><h3 className="text-lg font-semibold">{title}</h3></div><div className="mt-3">{children}</div></Card>;
 return <div className="grid lg:grid-cols-3 gap-4 items-start">
  <Step n="1" title="Choose what to share"><div className="flex items-start gap-3"><button role="switch" aria-checked={share} aria-labelledby="shl" onClick={()=>setShare(!share)} className={`mt-0.5 h-8 w-14 flex-none rounded-full p-1 transition-colors ${share?'bg-acc':'bg-line'}`}><span className="block h-6 w-6 rounded-full bg-card transition-transform duration-300" style={{transform:share?'translateX(24px)':'none'}}/></button>
   <div><p id="shl" className="font-semibold text-sm">Share speed results</p><p className="text-sm text-mute mt-1">Adds your measured tok/s to the planner for everyone with the same device. Only device model, file and speeds are sent; no hostname or files.</p></div></div>
   <p className="text-sm mt-4"><span className="serif text-3xl num">{RUNS}</span> <span className="text-mute">runs shared so far across {new Set(MEASURED.map(x=>x.dev)).size} devices</span></p></Step>
  <Step n="2" title="Run the probe"><div className="flex items-center gap-2 rounded-2xl bg-night text-white p-3"><span className="text-acc"><Ico n="term" on size={18}/></span><code key={cmd} className="fade flex-1 font-mono text-sm break-all">{cmd}</code>
   <button onClick={()=>navigator.clipboard?.writeText(cmd).then(()=>{setCp('Copied');setTimeout(()=>setCp(''),1400)}).catch(()=>{})} className="h-9 px-3 rounded-full bg-white text-night text-xs font-bold min-w-[4.5rem]">{cp?<span className="pop inline-block">{cp}</span>:'Copy'}</button></div>
   <p className="text-sm text-mute mt-3">Reads GPU, memory, disk and platform, tests memory bandwidth and compute, then times two small models in llama.cpp. About 2 minutes.</p></Step>
  <Step n="3" title="Paste the result"><label htmlFor="prof" className="sr-only">Profile JSON</label><textarea id="prof" value={txt} onChange={e=>{setTxt(e.target.value);setErr('')}} rows="5" className="w-full rounded-2xl border border-line bg-soft p-3 font-mono text-xs"/>
   {err&&<p className="text-warn text-sm font-semibold mt-1">{err}</p>}
   <div className="mt-3"><Pill acc onClick={apply} disabled={run}>{run?'Reading profile':'See what runs'}</Pill></div><p className="text-xs text-mute mt-2">Pre-filled with a sample DGX Spark profile.</p></Step>
 </div>;
}

/* ================= SHELL ================= */
const VIEWS=[['explorer','Explorer','Every model, every score','Compare closed and open models on intelligence, cost, speed and more.'],['recommend','Recommender','Find your model in five steps','Tell Atlas what matters. It ranks every model against your priorities.'],['hardware','Hardware','What runs on your machine?','Pick devices, type specs, or just describe your setup to Claude.'],['quants','Quants','Which quant should you download?','The same model from different uploaders, compared on size and quality loss.'],['probe','Device test','Measure, then share','Real numbers from your hardware make every estimate better.']];
function Stars(){const st=useMemo(()=>{let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;return Array.from({length:90},()=>({x:r()*100,y:r()*100,r:r()*1.3+.3,d:r()*3.2,t:r()<.35}))},[]);
 return <svg className="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true">{st.map((p,i)=><circle key={i} cx={p.x+'%'} cy={p.y+'%'} r={p.r} fill="#fff" opacity={p.t?undefined:.55} className={p.t?'tw':''} style={p.t?{animationDelay:p.d+'s'}:undefined}/>)}</svg>}
function App(){
 const init=()=>{const h=location.hash.slice(1);return VIEWS.some(v=>v[0]===h)?h:'explorer'};
 const [view,setView]=useState(init);const [sel,setSel]=useState(null);const [qid,setQid]=useState('q3827');
 const [mode,setMode]=useState('pick');const [picks,setPicks]=useState({spark:1});const [host,setHost]=useState({ram:64,rbw:90,disk:2000,dspd:5});
 const [manual,setManual]=useState(BLANK);const [aiSpec,setAiSpec]=useState(null);const [profile,setProfile]=useState('');
 useEffect(()=>{const f=()=>setView(init());addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 const go=v=>{location.hash=v;setView(v);scrollTo({top:0,behavior:'smooth'})};
 const spec=mode==='manual'?manual:mode==='ai'?aiSpec:specFromPicks(picks,host);
 const toQuants=id=>{setQid(id);setSel(null);go('quants')};
 const V0=VIEWS.find(v=>v[0]===view);
 return <div className="min-h-screen">
  <div className="hero relative text-white overflow-hidden">
   <Stars/>
   <div className="relative max-w-[1240px] mx-auto px-4 sm:px-6">
    
    <header className="flex items-center gap-4 h-16 pt-2">
     <a href="#explorer" aria-label="Atlas home" onClick={e=>{e.preventDefault();go('explorer')}} className="flex items-center flex-none"><Wordmark/></a>
     <nav className="scroll nobar edge flex-1" aria-label="Sections"><div className="flex gap-1 w-max mx-auto">{VIEWS.map(([k,l])=><a key={k} href={'#'+k} onClick={e=>{e.preventDefault();go(k)}} aria-current={view===k?'page':undefined} className={`relative h-10 px-3 flex items-center text-xs font-semibold uppercase tracking-[.08em] rounded-full transition-colors ${view===k?'text-white':'text-white/65 hover:text-white'}`}>{l}{view===k&&<span className="pop absolute left-1/2 -ml-[3px] bottom-0.5 h-1.5 w-1.5 rounded-full bg-acc"/>}</a>)}</div></nav>
     <div className="hidden md:block flex-none"><Pill dark small onClick={()=>{setMode('ai');go('hardware')}}>Ask AI</Pill></div>
    </header>
    <div key={view} className="text-center pt-12 sm:pt-16 pb-36 sm:pb-44">
     <h1 className="fade text-[clamp(36px,6vw,72px)] font-semibold tracking-[-.03em] leading-[1.02] [text-wrap:balance] max-w-4xl mx-auto">{view==='explorer'?<>Find the right model.<br/>Run it on your hardware.</>:V0[2]}</h1>
     <p className="fade text-white/70 mt-4 max-w-xl mx-auto" style={{animationDelay:'80ms'}}>{V0[3]}</p>
     {view==='explorer'&&<div className="fade mt-12 grid grid-cols-2 lg:grid-cols-4 text-left border-t border-white/15" style={{animationDelay:'160ms'}}>{VIEWS.slice(1).map(([k,l,t],i)=><button key={k} onClick={()=>go(k)} className={`lift flex items-center gap-3 p-4 sm:p-5 hover:bg-white/5 transition-colors ${i?'lg:border-l border-white/15':''} ${i%2?'border-l border-white/15 lg:border-l':''}`}><Gem k={k}/><span className="flex-1"><span className="block font-semibold text-sm">{l}</span><span className="block text-xs text-white/60 mt-0.5 leading-snug">{t}</span></span><span className="arr text-white/80"><Ico n="arrow" size={18}/></span></button>)}</div>}
    </div>
   </div>
  </div>
  <div className="after">
   <main key={view} className="fade relative max-w-[1240px] mx-auto px-3 sm:px-6 -mt-28 sm:-mt-32 pb-16">
    {view==='explorer'&&<Explorer open={setSel}/>}
    {view==='recommend'&&<Recommender open={setSel}/>}
    {view==='hardware'&&<Planner {...{mode,setMode,picks,setPicks,manual,setManual,host,setHost,spec,setAiSpec,profile,toQuants}} open={setSel}/>}
    {view==='quants'&&<Quants {...{qid,setQid,spec}} open={setSel}/>}
    {view==='probe'&&<Probe onProfile={(s,p)=>{setManual(s);setMode('manual');setProfile(p);go('hardware')}}/>}
   </main>
  </div>
  <footer className="bg-night text-white/80"><div className="max-w-[1240px] mx-auto px-4 sm:px-6 py-12 grid sm:grid-cols-2 lg:grid-cols-4 gap-8 text-sm">
   <div><div className="text-white"><Wordmark size={34}/></div><p className="mt-2 text-white/60">A personal map of AI models: scores, prices, quants and the hardware to run them.</p></div>
   <div><div className="serif text-2xl text-white">Explore</div><ul className="mt-3 space-y-2">{VIEWS.map(([k,l])=><li key={k}><a href={'#'+k} onClick={e=>{e.preventDefault();go(k)}} className="hover:text-white">{l}</a></li>)}</ul></div>
   <div><div className="serif text-2xl text-white">Data</div><ul className="mt-3 space-y-2 text-white/60">{SOURCES.map(s=><li key={s.k}>{s.name} · {s.synced}</li>)}<li>Hugging Face · 1h ago</li></ul></div>
   <div><div className="serif text-2xl text-white">Notes</div><p className="mt-3 text-white/60">Benchmarks from <a className="underline" href="https://artificialanalysis.ai/">Artificial Analysis</a> and others. All values in this prototype are sample data; device specs are approximate.</p></div>
  </div></footer>
  {sel&&<Detail m={sel} close={()=>setSel(null)} spec={spec} toQuants={toQuants}/>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
</script>
</body>
</html>
