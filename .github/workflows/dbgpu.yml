# Weekly dbgpu import into `devices` (source = dbgpu, unverified; never overwrites curated rows). Owned by W3.
name: dbgpu-import

on:
  schedule:
    - cron: '0 15 * * 0'   # Sundays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbgpu-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dump the dbgpu database to JSON
        run: |
          python -m pip install --quiet dbgpu
          python -I - <<'PY'
          import json
          from dbgpu import GPUDatabase
          specs = [s.to_dict() for s in GPUDatabase.default().specs]
          with open("dbgpu.json", "w") as f:
              json.dump(specs, f, default=str)   # release_date is a date
          print(f"dumped {len(specs)} GPUs")
          PY

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm exec tsx scripts/import-dbgpu.ts dbgpu.json
